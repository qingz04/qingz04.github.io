<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 440 560" width="440" height="560" fill="none" stroke="#000" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
  <rect width="440" height="560" fill="#fff" stroke="none"/>

  <!-- quadcopter, seen from above -->
  <g transform="translate(220 52)">
    <line x1="-26" y1="-26" x2="26" y2="26"/>
    <line x1="-26" y1="26" x2="26" y2="-26"/>
    <circle cx="-26" cy="-26" r="11"/><circle cx="26" cy="-26" r="11"/>
    <circle cx="-26" cy="26" r="11"/><circle cx="26" cy="26" r="11"/>
    <circle cx="0" cy="0" r="4" fill="#000"/>
  </g>
  <!-- camera looking down -->
  <line x1="220" y1="86" x2="220" y2="118" stroke="#9A9A9A" stroke-dasharray="3 4"/>

  <!-- three boustrophedon strips of overlapping frame footprints -->
  <g stroke="#000" stroke-width="1.2">
    <!-- strip 1, flying down -->
    <g transform="translate(96 130)">
      <rect x="0" y="0"   width="60" height="40"/>
      <rect x="2" y="22"  width="60" height="40"/>
      <rect x="1" y="44"  width="60" height="40"/>
      <rect x="3" y="66"  width="60" height="40"/>
      <rect x="2" y="88"  width="60" height="40"/>
      <rect x="4" y="110" width="60" height="40"/>
      <rect x="3" y="132" width="60" height="40"/>
      <rect x="5" y="154" width="60" height="40"/>
    </g>
    <!-- strip 2, flying up -->
    <g transform="translate(190 130)">
      <rect x="4" y="0"   width="60" height="40"/>
      <rect x="2" y="22"  width="60" height="40"/>
      <rect x="3" y="44"  width="60" height="40"/>
      <rect x="1" y="66"  width="60" height="40"/>
      <rect x="2" y="88"  width="60" height="40"/>
      <rect x="0" y="110" width="60" height="40"/>
      <rect x="1" y="132" width="60" height="40"/>
      <rect x="0" y="154" width="60" height="40"/>
    </g>
    <!-- strip 3, flying down -->
    <g transform="translate(284 130)">
      <rect x="0" y="0"   width="60" height="40"/>
      <rect x="3" y="22"  width="60" height="40"/>
      <rect x="2" y="44"  width="60" height="40"/>
      <rect x="5" y="66"  width="60" height="40"/>
      <rect x="4" y="88"  width="60" height="40"/>
      <rect x="6" y="110" width="60" height="40"/>
      <rect x="5" y="132" width="60" height="40"/>
      <rect x="7" y="154" width="60" height="40"/>
    </g>
  </g>

  <!-- flight path, boustrophedon -->
  <g stroke="#9A9A9A" stroke-width="1.2" stroke-dasharray="4 4">
    <polyline points="128,124 128,330 222,330 222,124 316,124 316,330"/>
  </g>
  <!-- direction arrows -->
  <g stroke="#9A9A9A" stroke-width="1.2" fill="#9A9A9A">
    <path d="M124 300 L128 310 L132 300 Z"/>
    <path d="M218 154 L222 144 L226 154 Z"/>
    <path d="M312 300 L316 310 L320 300 Z"/>
  </g>

  <!-- convergence to one mosaic -->
  <g stroke="#9A9A9A" stroke-width="1" stroke-dasharray="2 4">
    <line x1="128" y1="342" x2="170" y2="396"/>
    <line x1="222" y1="342" x2="222" y2="396"/>
    <line x1="316" y1="342" x2="274" y2="396"/>
  </g>

  <!-- the mosaic -->
  <g transform="translate(110 400)">
    <rect x="0" y="0" width="220" height="132" stroke-width="1.6"/>
    <!-- seams between strips -->
    <path d="M74 0 C 70 30, 78 70, 72 132" stroke="#9A9A9A" stroke-width="1"/>
    <path d="M146 0 C 150 40, 142 90, 148 132" stroke="#9A9A9A" stroke-width="1"/>
    <!-- registration ticks -->
    <g stroke="#000" stroke-width="1">
      <line x1="-6" y1="0" x2="6" y2="0"/><line x1="0" y1="-6" x2="0" y2="6"/>
      <line x1="214" y1="132" x2="226" y2="132"/><line x1="220" y1="126" x2="220" y2="138"/>
    </g>
  </g>
</svg>
